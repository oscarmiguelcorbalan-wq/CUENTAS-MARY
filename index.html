<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas de Mary</title>
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas Mary">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #f3f5f2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .aviso { max-width: 460px; margin: 0 auto; padding: 32px 20px; color: #1d2621; line-height: 1.5; }
  .aviso h1 { font-size: 1.6rem; margin: 0 0 12px; }
  .aviso a { display: inline-block; margin-top: 12px; padding: 14px 20px; border-radius: 12px; background: #2f6b4f; color: #fff; font-weight: 600; text-decoration: none; }
  @media (prefers-color-scheme: dark) { html, body { background: #121815; } .aviso { color: #e7eee9; } }
</style>
</head>
<body>
<script>
  // ⬇️ PEGA AQUÍ el enlace de tu app de Apps Script (el que termina en /exec)
  var ENLACE_APP = 'https://script.google.com/macros/s/AKfycbwxZyw2l4yqlezptISW9Sp3WEMWpdTXOyth2FjCmBdi_9Pe5APeetxHJl7pTUEukg2eKQ/exec';

  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(ENLACE_APP)) {
    document.body.innerHTML =
      '<div class="aviso"><h1>Falta configurar la app</h1>' +
      '<p>Edita el archivo <b>index.html</b> en GitHub y pega el enlace de Apps Script ' +
      '(el que termina en <b>/exec</b>) donde pone PEGA_AQUI_TU_ENLACE_EXEC.</p></div>';
  } else {
    var marco = document.createElement('iframe');
    marco.src = ENLACE_APP;
    marco.title = 'Cuentas de Mary';
    marco.allow = 'camera; clipboard-write';
    document.body.appendChild(marco);

    // Si la app no carga en 20 segundos, ofrecer abrirla directamente
    var cargada = false;
    marco.onload = function () { cargada = true; };
    setTimeout(function () {
      if (cargada) return;
      var d = document.createElement('div');
      d.className = 'aviso';
      d.style.cssText = 'position:fixed;inset:auto 0 0 0;background:inherit';
      d.innerHTML = '<p>¿La app no carga?</p><a href="' + ENLACE_APP + '">Abrirla directamente</a>';
      document.body.appendChild(d);
    }, 20000);
  }
</script>
</body>
</html>
